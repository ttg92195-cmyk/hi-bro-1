name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools & NDK
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Download Godot Editor
        run: |
          echo "Downloading Godot ${GODOT_VERSION} editor..."
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot-editor.zip || \
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot-editor.zip
          unzip -o godot-editor.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          ln -sf Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          ./godot --version || echo "Godot version check done"

      - name: Download and install export templates
        run: |
          echo "Downloading Godot ${GODOT_VERSION} export templates..."
          wget -q "https://downloads.tuxfamily.org/godotengine/${GODOT_VERSION}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O export_templates.tpz || \
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          echo "Export templates installed:"
          ls -la ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Create debug keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 \
            -deststoretype pkcs12
          echo "Keystore created at: $(pwd)/debug.keystore"

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/Godot
          cat > ~/.config/Godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_pass = "android"
          export/android/debug_keystore_user = "androiddebugkey"
          EOF
          echo "Editor settings configured:"
          cat ~/.config/Godot/editor_settings-4.tres

      - name: Update export presets with keystore
        run: |
          # Update the Android preset keystore settings
          sed -i 's|keystore/debug=""|keystore/debug="res://debug.keystore"|' export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' export_presets.cfg
          echo "Updated export_presets.cfg:"
          cat export_presets.cfg

      - name: Build Android APK
        run: |
          mkdir -p export/android
          echo "Starting Godot Android export..."
          ./godot --headless --export-debug "Android" export/android/NullvexGame.apk 2>&1 | tee build.log
          echo "Godot export command finished with exit code: $?"

      - name: Debug - search for APK
        if: always()
        run: |
          echo "=== Build log (last 50 lines) ==="
          tail -50 build.log 2>/dev/null || echo "No build log"
          echo ""
          echo "=== Searching all APK files ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found anywhere"
          echo ""
          echo "=== Export directory ==="
          ls -laR export/ 2>/dev/null || echo "export/ not found"
          echo ""
          echo "=== Gradle build directory ==="
          find gradle_build/ -type f 2>/dev/null || echo "No gradle_build/ directory"

      - name: Find and copy APK to output
        id: find_apk
        run: |
          APK_PATH=""
          
          # Check primary export path
          if [ -f "export/android/NullvexGame.apk" ]; then
            echo "APK found at export/android/NullvexGame.apk"
            APK_PATH="export/android/NullvexGame.apk"
          fi
          
          # Check gradle build output
          if [ -z "$APK_PATH" ]; then
            GRADLE_APK=$(find gradle_build/ -name "*.apk" -type f 2>/dev/null | head -1)
            if [ -n "$GRADLE_APK" ]; then
              echo "APK found at gradle output: $GRADLE_APK"
              cp "$GRADLE_APK" export/android/NullvexGame.apk
              APK_PATH="export/android/NullvexGame.apk"
            fi
          fi
          
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_found=true" >> $GITHUB_OUTPUT
            ls -la "$APK_PATH"
            echo "APK size: $(du -h $APK_PATH | cut -f1)"
          else
            echo "apk_found=false" >> $GITHUB_OUTPUT
            echo "ERROR: No APK was produced by the build"
          fi

      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NullvexGame-Android-APK
          path: export/android/NullvexGame.apk
          retention-days: 30

      - name: Create Release with APK
        if: steps.find_apk.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.${{ github.run_number }}
          name: NullvexGame Android v1.${{ github.run_number }}
          files: export/android/NullvexGame.apk
          draft: false
          prerelease: false

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build.log
