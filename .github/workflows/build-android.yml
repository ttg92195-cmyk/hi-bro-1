name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools and NDK
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;23.2.8568313"

      - name: Create debug keystore in project root
        run: keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Download Godot 4.6 Editor
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip" -O godot-editor.zip
          unzip -o godot-editor.zip
          chmod +x Godot_v4.6-stable_linux.x86_64
          ln -sf Godot_v4.6-stable_linux.x86_64 godot

      - name: Download and install export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz" -O export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.6.stable
          unzip -q export_templates.tpz
          cp -r templates/* ~/.local/share/godot/export_templates/4.6.stable/

      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/Godot/
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > ~/.config/Godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"${ANDROID_HOME}\"" >> ~/.config/Godot/editor_settings-4.tres
          echo "export/android/debug_keystore = \"${GITHUB_WORKSPACE}/debug.keystore\"" >> ~/.config/Godot/editor_settings-4.tres
          echo "export/android/debug_keystore_pass = \"android\"" >> ~/.config/Godot/editor_settings-4.tres
          echo "export/android/debug_keystore_user = \"androiddebugkey\"" >> ~/.config/Godot/editor_settings-4.tres

      - name: Verify export presets
        run: |
          echo "=== package/name in export_presets.cfg ==="
          grep "package/name" export_presets.cfg
          echo "=== keystore/debug in export_presets.cfg ==="
          grep "keystore/debug" export_presets.cfg
          echo "=== project name in project.godot ==="
          grep "config/name" project.godot
          echo "=== strings.xml ==="
          cat android/build/res/values/strings.xml

      - name: Import project
        run: ./godot --headless --import project.godot 2>&1 || true

      - name: Build Android APK
        run: |
          mkdir -p export/android
          ./godot --headless --export-debug "Android" 2>&1 | tee build.log || true

      - name: Post-build - verify APK app name
        if: always()
        run: |
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "=== APK found: $APK ==="
            echo "=== Checking app_name inside APK ==="
            unzip -p "$APK" res/values/strings.xml 2>/dev/null || echo "No strings.xml in APK"
            echo ""
            echo "=== Checking AndroidManifest ==="
            unzip -p "$APK" AndroidManifest.xml 2>/dev/null | strings | grep -i "name" || echo "Binary manifest, checking aapt"
            aapt dump badging "$APK" 2>/dev/null | head -5 || echo "aapt not available"
          fi

      - name: Search for APK
        if: always()
        id: search
        run: |
          echo "=== Build log (last 40 lines) ==="
          tail -40 build.log 2>/dev/null || echo "No build log"
          echo ""
          echo "=== Searching APK files ==="
          find . -name "*.apk" -type f 2>/dev/null
          APK=$(find . -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mkdir -p export/android
            cp "$APK" export/android/NullvexGame.apk
            echo "apk_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "apk_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK
        if: steps.search.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NullvexGame-Android-APK
          path: export/android/NullvexGame.apk
          retention-days: 30

      - name: Create Release
        if: steps.search.outputs.apk_found == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.${{ github.run_number }}
          name: NullvexGame Android v1.${{ github.run_number }}
          files: export/android/NullvexGame.apk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
